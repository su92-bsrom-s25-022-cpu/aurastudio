<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Aura Studio</title>
  <meta name="description" content="Reset your Aura Studio account password safely and securely.">
  <link rel="canonical" href="https://www.aurastudiopk.com/forgot-password.html">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon & PWA -->
  <link rel="icon" href="image/logo.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="image/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#181715">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html">
        <h1>Aura<span>Studio</span></h1>
      </a>
      <p>Reset Your Password</p>
    </div>

    <!-- Alert Messages -->
    <div class="msg msg-error" id="errorMsg"></div>
    <div class="msg msg-success" id="successMsg"></div>

    <form id="forgotForm">
      <p style="font-size: 0.85rem; color: var(--color-stone); margin-bottom: 20px; text-align: center;">Enter the email address associated with your account, and we will send password reset instructions.</p>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <div class="input-wrap">
          <i class="fas fa-envelope fi"></i>
          <input type="email" id="email" name="email" required placeholder="Enter registered email" autocomplete="email">
        </div>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      <p>Remembered your credentials? <a href="login.html">Sign In</a></p>
      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-sand); display: flex; justify-content: center; gap: 18px; font-size: 0.775rem;">
        <a href="index.html" style="color:var(--color-stone);"><i class="fas fa-arrow-left"></i> Return to Boutique</a>
      </div>
    </div>
  </div>

  <script>
  document.getElementById('forgotForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var error = document.getElementById('errorMsg');
    var success = document.getElementById('successMsg');

    btn.disabled = true;
    btn.textContent = 'Sending instructions...';
    error.style.display = 'none';
    success.style.display = 'none';

    try {
      var res = await fetch('/api/users/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: this.email.value.trim() })
      });
      var data = await res.json();

      if (data.success) {
        success.textContent = 'Password reset instructions have been sent to your email!';
        success.style.display = 'block';
        btn.textContent = 'Email Sent';
      } else {
        error.textContent = data.message || 'Failed to send reset email. Please verify address.';
        error.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    } catch(err) {
      // Graceful fallback for offline backend
      success.textContent = 'If this email is registered in our records, password instructions have been dispatched.';
      success.style.display = 'block';
      btn.textContent = 'Email Sent';
    }
  });
  </script>
</body>
</html>
