<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Aura Studio</title>
  <meta name="description" content="Sign in to your Aura Studio account to manage orders, view your luxury wardrobe wishlist, or access administrative features.">
  <link rel="canonical" href="https://www.aurastudiopk.com/login.html">
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon & PWA -->
  <link rel="icon" href="image/logo.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="image/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#181715">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">

  <!-- Firebase Scripts (Preserved for Google OAuth) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html">
        <h1>Aura<span>Studio</span></h1>
      </a>
      <p>Welcome back. Sign in to your account</p>
    </div>

    <!-- Alert Messages -->
    <div class="msg msg-error" id="errorMsg"></div>
    <div class="msg msg-success" id="successMsg"></div>

    <!-- Unified Login Form (Customer & Admin) -->
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope fi"></i>
          <input type="email" id="email" name="email" required placeholder="Enter your email" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="password">Password</label>
          <div class="forgot-link">
            <a href="forgot-password.html">Forgot password?</a>
          </div>
        </div>
        <div class="input-wrap">
          <i class="fas fa-lock fi"></i>
          <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-pw" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <i class="fas fa-eye" id="toggleIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="auth-btn" id="submitBtn">Sign In</button>
    </form>

    <div class="divider">or continue with</div>

    <button type="button" class="google-btn" id="googleBtn" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
      <span>Sign in with Google</span>
    </button>

    <div class="auth-footer">
      <p>Do not have an account? <a href="signup.html">Create Account</a></p>
      <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-sand); display: flex; justify-content: center; gap: 18px; font-size: 0.775rem;">
        <a href="index.html" style="color:var(--color-stone);"><i class="fas fa-arrow-left"></i> Return to Store</a>
        <a href="track-order.htm" style="color:var(--color-stone);"><i class="fas fa-truck"></i> Track Order</a>
      </div>
    </div>
  </div>

  <script>
  // Firebase initialization for Google Auth
  try {
    firebase.initializeApp({
      apiKey: "AIzaSyDSlVRIlVj_x35YT6dIiISMFKICjy8LR2g",
      authDomain: "aurastudio-a0cc4.firebaseapp.com",
      projectId: "aurastudio-a0cc4"
    });
  } catch(e) {}

  var auth = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth() : null;
  var googleProvider = (typeof firebase !== 'undefined' && firebase.auth) ? new firebase.auth.GoogleAuthProvider() : null;

  function togglePasswordVisibility() {
    var pw = document.getElementById('password');
    var icon = document.getElementById('toggleIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      pw.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  // Google Login
  function googleLogin() {
    if (!auth || !googleProvider) {
      alert('Google authentication service is currently loading. Please try standard sign-in.');
      return;
    }

    var btn = document.getElementById('googleBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting to Google...';

    auth.signInWithPopup(googleProvider)
      .then(function(result) {
        var user = result.user;
        fetch('/api/users/google-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: user.displayName,
            email: user.email,
            googleId: user.uid,
            photo: user.photoURL
          })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.success) {
            localStorage.setItem('userToken', data.token);
            localStorage.setItem('userData', JSON.stringify(data.user));
            // Role-aware redirect
            if (data.user && (data.user.role === 'admin' || data.user.isAdmin)) {
              localStorage.setItem('admin_token', data.token);
              localStorage.setItem('admin', JSON.stringify(data.user));
              window.location.href = 'admin/dashboard.html';
              return;
            }
          } else {
            localStorage.setItem('userData', JSON.stringify({
              name: user.displayName,
              email: user.email,
              photo: user.photoURL
            }));
            localStorage.setItem('userToken', 'google-' + user.uid);
          }
          document.getElementById('successMsg').textContent = 'Welcome back, ' + user.displayName + '!';
          document.getElementById('successMsg').style.display = 'block';
          setTimeout(function() { window.location.href = 'index.html'; }, 800);
        })
        .catch(function() {
          localStorage.setItem('userData', JSON.stringify({
            name: user.displayName,
            email: user.email,
            photo: user.photoURL
          }));
          localStorage.setItem('userToken', 'google-' + user.uid);
          window.location.href = 'index.html';
        });
      })
      .catch(function(error) {
        btn.disabled = false;
        btn.innerHTML = '<span>Sign in with Google</span>';
        if (error.code !== 'auth/popup-closed-by-user') {
          document.getElementById('errorMsg').textContent = error.message || 'Google sign-in failed';
          document.getElementById('errorMsg').style.display = 'block';
        }
      });
  }

  // Unified Email/Password Login
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var btn = document.getElementById('submitBtn');
    var error = document.getElementById('errorMsg');
    var success = document.getElementById('successMsg');
    btn.disabled = true;
    btn.textContent = 'Verifying credentials...';
    error.style.display = 'none';
    success.style.display = 'none';

    try {
      var res = await fetch('/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: this.email.value.trim(), password: this.password.value })
      });
      var data = await res.json();

      if (data.success) {
        localStorage.setItem('userToken', data.token);
        localStorage.setItem('userData', JSON.stringify(data.user));

        // Check if role is admin -> redirect to admin dashboard
        var isAdmin = (data.user && (data.user.role === 'admin' || data.user.isAdmin)) || data.role === 'admin';
        if (isAdmin) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin', JSON.stringify(data.user));
          success.textContent = 'Administrator verified. Loading dashboard...';
          success.style.display = 'block';
          setTimeout(function() { window.location.href = 'admin/dashboard.html'; }, 800);
        } else {
          success.textContent = 'Signed in successfully. Redirecting...';
          success.style.display = 'block';
          setTimeout(function() { window.location.href = 'profile.html'; }, 800);
        }
      } else {
        error.textContent = data.message || 'Invalid email or password';
        error.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    } catch(err) {
      error.textContent = 'Network or server communication error. Please try again.';
      error.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  // If already logged in, redirect to profile or admin
  if (localStorage.getItem('admin_token')) {
    window.location.href = 'admin/dashboard.html';
  } else if (localStorage.getItem('userToken')) {
    window.location.href = 'profile.html';
  }
  </script>
</body>
</html>
